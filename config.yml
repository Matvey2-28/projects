# Define the system of units to use internally. 
InternalUnitSystem:
  UnitMass_in_cgs:     1000    # Grams
  UnitLength_in_cgs:   100  # Centimeters
  UnitVelocity_in_cgs: 100  # Centimeters per second
  UnitCurrent_in_cgs:  1   # Amperes
  UnitTemp_in_cgs:     1   # Kelvin

Scheduler:
  max_top_level_cells: 12
  
# Parameters governing the time integration
TimeIntegration:
  time_begin: 0     # The starting time of the simulation (in internal units).
  time_end:   34560000  # The end time of the simulation (in internal units).
  dt_min:     1e-3  # The minimal time-step size of the simulation (in internal units).
  dt_max:     1000.   # The maximal time-step size of the simulation (in internal units).

# Parameters governing the conserved quantities statistics
Statistics:
  delta_time:          86400. # Time between statistics output
  
# Parameters governing the snapshots
Snapshots:
  basename:    ./   # Common part of the name of output files
  time_first:  0.           # Time of the first output (in internal units)
  delta_time:  86400          # Time difference between outputs (in internal units)

# Parameters for the hydrodynamics scheme
SPH:
  resolution_eta:        1.2349   # Target smoothing length in units of the mean inter-particle separation (1.2349 == 48Ngbs with the cubic spline kernel).
  delta_neighbours:      0.1      # The tolerance for the targetted number of neighbours.
  CFL_condition:         0.1      # Courant-Friedrich-Levy condition for time integration.
  max_ghost_iterations:  30       # Maximal number of iterations allowed to converge towards the smoothing length.
  h_max:                 5.0e14      # Maximal smoothing length allowed (in internal units).
  h_tolerance: 0.0001
  h_min_ratio: 0
  use_mass_weighted_num_ngb: 0
  max_volume_change: 1.4
  initial_temperature: 0
  minimal_temperature: 0
  H_ionization_temperature: 10000
  H_mass_fraction: 0.752
  viscosity_alpha: 2
  viscosity_alpha_max: 4
  viscosity_alpha_min: 0
  viscosity_length: 0.05
  diffusion_alpha: 0
  diffusion_beta: 1
  diffusion_alpha_max: 1
  diffusion_alpha_min: 0
  particle_splitting: 0



# Parameters for the self-gravity scheme
Gravity:
  eta:                      0.025     # Constant dimensionless multiplier for time integration.
  MAC:                      adaptive
  epsilon_fmm:              0.001
  theta_cr:                 0.7       # Opening angle (Multipole acceptance criterion)
  mesh_side_length:         128
  #comoving_DM_softening:         1e10 # Comoving DM softening length (in internal units).
  max_physical_DM_softening:     1e11    # Max physical DM softening length (in internal units).
  max_physical_baryon_softening:    1e11

# Parameters related to the initial conditions
InitialConditions:
  file_name:  IC.hdf5       # The file to read
  periodic:   1