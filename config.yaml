FIELDS:

      T_MIN_DISK:
          type: decimal
          title:
              ru: Начальное значение температуры
          hint:
              ru: Введите начальное значение температуры тела в Кельвинах
          default: 100

      T_MIN_SPHERE:
          type: decimal
          title:
              ru: Начальное значение температуры
          hint:
              ru: Введите начальное значение температуры тела в Кельвинах
          default: 100

      T_MIN_NEBULA:
          type: decimal
          title:
              ru: Начальное значение температуры
          hint:
              ru: Введите начальное значение температуры тела в Кельвинах
          default: 100

      VEL:
          type: string
          title:
              ru: Направление скорости частиц
          hint:
              ru: По какому направлению относитьельно тела будут двигаться частицы
          default: 'clockwise'
          enum:
            - value: 'clockwise'
              name:
                  ru: По часовой стрелке
            - value: 'counterclockwise'
              name:
                  ru: Против часовой стрелки

      VEL_3D_SPHERE:
          type: string
          title:
              ru: Направление скорости частиц
          hint:
              ru: По какому направлению относитьельно тела будут двигаться частицы
          default: 'clockwise'
          enum:
            - value: 'clockwise'
              name:
                  ru: По часовой стрелке
            - value: 'counterclockwise'
              name:
                  ru: Против часовой стрелки
            - value: 'up-circle'
              name:
                  ru: Вверх по кругу
            - value: 'down-circle'
              name:
                  ru: Вниз по кругу

      VEL_3D_NEBULA:
          type: string
          title:
              ru: Направление скорости частиц
          hint:
              ru: По какому направлению относитьельно тела будут двигаться частицы
          default: 'clockwise'
          enum:
            - value: 'clockwise'
              name:
                  ru: По часовой стрелке
            - value: 'counterclockwise'
              name:
                  ru: Против часовой стрелки
            - value: 'up-circle'
              name:
                  ru: Вверх по кругу
            - value: 'down-circle'
              name:
                  ru: Вниз по кругу

      PHYS_FUNC:
          type: string
          title:
              ru: Физическая функция
          hint:
              ru: Введите по какой математической функции будут строиться температуры и плотности
          default: 'bell'
          enum:
            - value: 'bell'
              name:
                  ru: Функция Белла
            - value: 'radius'
              name:
                  ru: Радиус-функция
            
      
      M_DISK:
          type: decimal
          title:
              ru: Масса материальной частицы
          hint:
              ru: Введите массу материальной частицы в кг
          min: 1
          default: 150

      M_SPHERE:
          type: decimal
          title:
              ru: Масса материальной частицы
          hint:
              ru: Введите массу материальной частицы в кг
          min: 1
          default: 150

      M_NEBULA:
          type: decimal
          title:
              ru: Масса материальной частицы
          hint:
              ru: Введите массу материальной частицы в кг
          min: 1
          default: 150
              
      DEC_STEP_M_DISK:
          type: decimal
          title:
              ru: Степень десяти для массы частицы
          hint:
              ru: В какой степени десяти измеряется масса частицы
          min: 1
          default: 24

      DEC_STEP_M_SPHERE:
          type: decimal
          title:
              ru: Степень десяти для массы частицы
          hint:
              ru: В какой степени десяти измеряется масса частицы
          min: 1
          default: 24

      DEC_STEP_M_NEBULA:
          type: decimal
          title:
              ru: Степень десяти для массы частицы
          hint:
              ru: В какой степени десяти измеряется масса частицы
          min: 1
          default: 24

    

STRUCTURE:

- group:
        key: phys_set
        title:  
            ru: Физические параметры тела
        fields:
            - separator:
                title:
                  ru: Определение функции по которой будет идти расстановка температур и плотностей
            - field: PHYS_FUNC
              width: full
            - separator:
                title:
                  ru: Диск
            - field: VEL
              width: full
              view: dropdown
            - field: T_MIN_DISK
              width: full
            - field: M_DISK
            - field: DEC_STEP_M_DISK
            - separator:
                title:
                  ru: Шар
            - field: VEL_3D_SPHERE
              width: full
              view: dropdown
            - field: T_MIN_SPHERE
              width: full
            - field: M_SPHERE
            - field: DEC_STEP_M_SPHERE
            - separator:
                title:
                  ru: Туманность
            - field: VEL_3D_NEBULA
              width: full
              view: dropdown
            - field: T_MIN_NEBULA
              width: full
            - field: M_NEBULA
            - field: DEC_STEP_M_NEBULA
    
            
            
            
            
            


UNITS:
    lenght:
        m:
            title:
                ru: Метры
            cm: 1
        mm:
            title:
                ru: Сантиметры
            m: 0.001
        cm:
            title:
                ru: Сантиметры
            m: 0.01
        km:
            title:
                ru: Сантиметры
            m: 1000