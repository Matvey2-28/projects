FIELDS:

    PHYS_PAR:
      title:
        ru: Определить физические параметры
      type: object

      FIELDS:

          T_MIN:
              type: decimal
              title:
                  ru: Начальное значение температуры
              hint:
                  ru: Введите начальное значение температуры тела в Кельвинах
              default: 100
      
          RHO_MIN:
              type: decimal
              title:
                  ru: Начальное значение плотности
              hint:
                  ru: Введите начальное значение температуры тела в Кельвинах
              default: 100
      
          M:
              type: decimal
              title:
                  ru: Масса 
              hint:
                  ru: Введите массу тела в кг
              min: 1
              default: 150
              
          DEC_STEP_M:
              type: decimal
              title:
                  ru: Степень десяти для массы
              hint:
                  ru: В какой степени десяти измеряется масса тела
              min: 1
              default: 24

      STRUCTURE:
          - group:
              key: phys_settings
              title:  
                  ru: Физические параметры тела
              fields:
                  - field: T_MIN
                    width: full
                  - field: RHO_MIN
                    width: full
                  - field: M
                  - field: DEC_STEP_M
    

STRUCTURE:

- group:
        key: phys_set
        title:  
            ru: Физические параметры тела
        fields:
            - separator:
                title:
                  ru: Добавление тела и его физических параметров
            - field: PHYS_PAR
              width: full
    
            
            
            
            
            


UNITS:
    lenght:
        m:
            title:
                ru: Метры
            cm: 1
        mm:
            title:
                ru: Сантиметры
            m: 0.001
        cm:
            title:
                ru: Сантиметры
            m: 0.01
        km:
            title:
                ru: Сантиметры
            m: 1000