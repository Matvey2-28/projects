FIELDS:   
    TIME_END:
        type: integer
        title:
            ru: Время расчета
        hint:
            ru: Введите желаемое время расчета в днях
        min: 7
        max: 1000
        default: 365

    DELTA_TIME:
        type: integer
        title:
            ru: Период расчета
        hint:
            ru: Введите желаемый период расчета в часах
        min: 1
        max: 168
        default: 24

    BOX_SIZE:
        type: integer
        title:
            ru: Величина рабочей области
        hint:
            ru: Введите размер рабочей области расчета вашей задачи в желаемых единицах
        units: lenght
        default: 20
    
    GAS_DISKS:
        title:
          ru: Газовые диски
        type: object
        FIELDS:
          NUM_PART:
              type: integer
              title:
                  ru: Количество частиц
              hint:
                  ru: Введите желаемое количество частиц
              min: 5000
              max: 5000000
              default: 15000

          RADIUS_EXTERIOR:
              type: decimal
              title:
                  ru: Наружный радиус
              hint:
                  ru: Введите радиус в желаемых единицах
              min: 0.1
              units: lenght
              default: 1.5

          RADIUS_INTERIOR:
              type: decimal
              title:
                  ru: Внутренний радиус
              hint:
                  ru: Введите желаемый радиус отверстия в желаемых единицах
              min: 0.1
              units: lenght
              default: 0.5

          THICKNESS:
              type: decimal
              title:
                  ru: Толщина 
              hint:
                  ru: Введите желаемую толщину в желаемых единицах
              min: 0.05
              units: lenght
              default: 0.3

          XO:
              type: integer
              title:
                  ru: X нулевое
              hint:
                  ru: Введите X нулевое в желаемых единицах
              units: lenght
              default: 10

          YO:
              type: integer
              title:
                  ru: Y нулевое
              hint:
                  ru: Введите Y нулевое в желаемых единицах
              units: lenght
              default: 10

          ZO:
              type: integer
              title:
                  ru: Z нулевое
              hint:
                  ru: Введите Z нулевое в желаемых единицах
              units: lenght
              default: 10

          PHYS_FUNC:
              type: string
              title:
                  ru: Физическая функция
              hint:
                  ru: Введите по какой математической функции будут строиться температуры и плотности
              default: 'bell'
              enum:
                - value: 'bell'
                  name:
                      ru: Функция Белла
                - value: 'radius'
                  name:
                      ru: Радиус-функция

          T_MIN_NEBULA:
              type: decimal
              title:
                  ru: Начальное значение температуры
              hint:
                  ru: Введите начальное значение температуры тела в Кельвинах
              default: 100

          DIRECTION:
              type: string
              title:
                  ru: Направление скорости частиц
              hint:
                  ru: По какому направлению относитьельно тела будут двигаться частицы
              default: 'clockwise'
              enum:
                - value: 'clockwise'
                  name:
                      ru: По часовой стрелке
                - value: 'counterclockwise'
                  name:
                      ru: Против часовой стрелки

        STRUCTURE:
            - group:
                key: user_satelite
                title:
                  ru: Добавить
                fields:
                    - separator:
                        title:
                          ru: Структурные параметры
                      width: full  
                    - field: NUM_PART
                    - field: RADIUS_EXTERIOR
                    - field: RADIUS_INTERIOR
                    - field: THICKNESS
                    - field: XO 
                      width: full
                    - field: YO 
                      width: full
                    - field: ZO 
                      width: full
                    - separator:
                        title:
                          ru: Физические параметры
                    - field: PHYS_FUNC
                      width: full
                    - field: T_MIN_NEBULA
                      width: full
                    - field: DIRECTION
                      width: full
                      view: dropdown

